{% extends "base.html" %}
{% block title %}Registro | Gordon BetScanner{% endblock %}
{% block content %}
<section class="section auth-panel">
  <article class="panel">
    <div class="panel-head">
      <h3>Crear cuenta</h3>
      <p>Plan free por defecto</p>
    </div>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post" class="account-form">
      <label>
        <span>Correo</span>
        <input type="email" name="gmail" value="{{ gmail }}" autocomplete="email" required>
      </label>
      <label>
        <span>Nombre</span>
        <input type="text" name="nombre" value="{{ nombre }}" autocomplete="username" required>
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <button type="submit">Crear cuenta</button>
    </form>
    <p class="form-note">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
  </article>
</section>
{% endblock %}
