{% extends "base.html" %}
{% block title %}Iniciar sesión | Gordon BetScanner{% endblock %}
{% block nav_login %}active{% endblock %}
{% block content %}
<div style="display:flex;justify-content:center;padding-top:32px;">
  <div style="width:100%;max-width:440px;">
    <div class="card" style="overflow:hidden;">
      <div class="card-head">
        <span class="card-title">Iniciar sesión</span>
        <span style="font-size:13px;color:var(--muted);">Acceso por correo y contraseña</span>
      </div>
      <div style="padding:24px;">
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="post" class="account-form">
          <div class="field">
            <label class="field-label" for="inp-email">Correo</label>
            <input class="input" type="email" id="inp-email" name="gmail" value="{{ gmail }}" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="field-label" for="inp-pw">Contraseña</label>
            <input class="input" type="password" id="inp-pw" name="password" autocomplete="current-password" required>
          </div>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="btn primary" style="width:100%;justify-content:center;margin-top:4px;">Entrar</button>
        </form>
        <p class="form-note" style="margin-top:16px;text-align:center;">¿No tienes cuenta? <a href="/register" style="color:var(--brand);font-weight:600;">Crear cuenta</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
