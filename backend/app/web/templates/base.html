<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gordon BetScanner{% endblock %}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="shell-header">
    <div class="shell-brand">
      <a href="/" class="brand-link">Gordon BetScanner</a>
    </div>
    <nav class="shell-nav">
      <a href="/?day={{ day }}" class="nav-link">Ligas</a>
      <a href="/daily-value?day={{ day }}" class="nav-link">Ranking diario{% if not plan_access.can_view_daily_value %} <span class="pro-inline">PRO</span>{% endif %}</a>
      {% if current_user %}
      <a href="/account" class="nav-link">Mi cuenta</a>
      {% else %}
      <a href="/login" class="nav-link">Iniciar sesión</a>
      {% endif %}
      <!-- <a href="/docs" class="nav-link">Docs API</a> -->
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
